name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check.py
  executable:
    name: Executable / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build and test executable
        run: make release PYTHON=python
      - name: Package and test extracted executable
        run: .venv/bin/python scripts/package.py
  result:
    name: CI result
    if: always()
    needs: [source, executable]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require both matrices to succeed
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          EXECUTABLE_RESULT: ${{ needs.executable.result }}
        run: test "$SOURCE_RESULT" = success && test "$EXECUTABLE_RESULT" = success
