name: Release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Validate tag syntax
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve one commit for all builds
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x86_64
            venv_python: .venv/bin/python
          - runner: macos-15
            artifact: darwin-aarch64
            venv_python: .venv/bin/python
          - runner: windows-2025
            artifact: windows-x86_64
            venv_python: .venv/Scripts/python.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --yes --no-progress
      - name: Build and test
        shell: bash
        run: make release PYTHON=python
      - name: Package tagged candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          "${{ matrix.venv_python }}" scripts/package.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify assets and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_COMMIT"
          for platform in darwin-aarch64 linux-x86_64 windows-x86_64; do
            archive="feros-builder-$RELEASE_TAG-$platform.tar.gz"
            test -f "dist/$archive"
            test -f "dist/$archive.sha256"
            (cd dist && sha256sum -c "$archive.sha256")
          done
          printf '%s\n\n' \
            "FeROS Builder $RELEASE_TAG" \
            "Source commit: $SOURCE_COMMIT" \
            'RK3566 RKNS image construction and validation from explicit inputs.' \
            'Native macOS ARM64, Linux x86_64, and Windows x86_64 packages were built and tested in this workflow.' \
            'Experimental 0.x release. Hash validation is not firmware authentication or physical boot verification.' \
            'macOS binaries are not notarized; Windows binaries are not Authenticode-signed. Review BUILD-INFO.json for build-host details.' \
            'Maintainer review required: notices, compatibility, reporting channels, and CHANGELOG before publication.' \
            > release-notes.md
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 \
            --verify-tag --draft --title "FeROS Builder $RELEASE_TAG" \
            --notes-file release-notes.md
